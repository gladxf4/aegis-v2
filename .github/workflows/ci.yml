name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check JavaScript style and errors
        run: npm run lint

      - name: Check project formatting
        run: npm run format:check

      - name: Run proof and API checks
        run: npm test

      - name: Prepare Vercel static assets
        run: npm run prepare:web
